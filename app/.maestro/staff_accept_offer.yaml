# Maestro flow (iOS simulator / Android emulator, development build).
# Precondition: `supabase db reset` (seed) and the admin has published a draft
# ICU shift (see admin_publish_shift.yaml), so nurse01 holds an offer.
appId: app.fairshift.mobile
---
- launchApp:
    clearState: true
- tapOn:
    id: "email"
- inputText: "nurse01@demo.fairshift.app"
- tapOn:
    id: "password"
- inputText: "Password123!"
- tapOn:
    id: "sign-in"
- extendedWaitUntil:
    visible: "View offer|Ver oferta"
    timeout: 20000
- tapOn: "View offer|Ver oferta"
- assertVisible:
    id: "accept-offer"
- tapOn:
    id: "accept-offer"
- assertVisible: ".*(It's yours|Ele é seu).*"
